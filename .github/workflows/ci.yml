name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax & Build Check
        run: npm run check

      - name: Production Bundle Build
        run: npm run build

      - name: Smoke Test (Server Health Check in DEMO_ONLY mode)
        run: |
          DEMO_ONLY=1 PORT=3000 ADMIN_PASSWORD=test_secret node server.js &
          SERVER_PID=$!
          echo "Waiting for server to start..."
          sleep 3
          curl -fsS http://localhost:3000/health || (echo "Health check failed" && kill $SERVER_PID && exit 1)
          echo "Health check succeeded! Stopping server..."
          kill $SERVER_PID
